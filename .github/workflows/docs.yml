name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: docs
        env:
          # A mirror, not a second home: canonical + sitemap point at the real
          # docs so the two copies consolidate instead of competing.
          DOCS_SITE: https://docs.cartapel.com/
        run: pnpm build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  # docs.cartapel.com — the canonical docs. Built separately because it is
  # served at the domain root while the GitHub Pages mirror lives under
  # /cartapel/.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: docs
        env:
          DOCS_BASE: /
          DOCS_SITE: https://docs.cartapel.com/
        run: pnpm build
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler pages deploy docs/.vitepress/dist --project-name=cartapel-docs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4f4a3012e87f6e29407917eb5ee72760
