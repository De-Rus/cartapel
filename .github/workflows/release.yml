name: release

on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One static binary per platform, the same four Homebrew serves. The UI is
  # built first and embedded; pure-Rust TLS (rustls/ring) is what makes the
  # musl targets static with nothing to apt-get.
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,        target: aarch64-apple-darwin }
          - { os: macos-14,        target: x86_64-apple-darwin }   # cross from arm64: macos-13 runners sit in queue for ages
          - { os: ubuntu-latest,   target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Build the UI
        run: cd ui && pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/cartapel" cartapel
          tar czf "dist/cartapel-${{ matrix.target }}.tar.gz" cartapel
          (cd dist && shasum -a 256 "cartapel-${{ matrix.target }}.tar.gz" | cut -d' ' -f1 > "cartapel-${{ matrix.target }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: cartapel-${{ matrix.target }}
          path: dist/*

  # The tag is the release: a GitHub Release with notes from the commits since
  # the previous tag and the binaries attached, so the Releases page says what
  # the registry already knows. Without this the page froze at v0.9.20 while
  # fifteen tags shipped images.
  github-release:
    runs-on: ubuntu-latest
    needs: [image, binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Notes from the commits since the previous tag: there are no pull
      # requests here for GitHub's own generator to read, so it would print an
      # empty body with a compare link.
      - name: Notes from commits
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}${GITHUB_REF_NAME}
          git log --format='- %s' "$range" | grep -v 'chore(release)' \
            | sed -E 's/^- (feat|fix|docs|test|chore|ci|refactor|perf)\(([^)]*)\): /- **\2** — /' > notes.md
          [ -s notes.md ] || echo '- housekeeping' > notes.md
          [ -n "$prev" ] && printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*

  # Re-stamps the checked-in formula and cask with this tag's version and the
  # sha256s the build just published, then pushes them to the tap — same shape
  # as the sixtysix agent's release. Needs TAP_REPO (var) and TAP_SSH_KEY (a
  # deploy key that can write to the tap repo and nothing else).
  homebrew:
    runs-on: ubuntu-latest
    needs: github-release
    if: vars.TAP_REPO != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Re-stamp the formula and cask
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import re, sys, pathlib
          version = sys.argv[1]
          def digest(target):
              d = pathlib.Path(f"dist/cartapel-{target}.sha256").read_text().strip()
              if not re.fullmatch(r"[0-9a-f]{64}", d):
                  raise SystemExit(f"bad sha256 for {target}: {d!r}")
              return d
          def bump(src):
              src = re.sub(r'^(\s*version\s+")[^"]+(")', rf'\g<1>{version}\g<2>', src, flags=re.M)
              return re.sub(r'/download/v[^/]+/', f'/download/v{version}/', src)
          f = pathlib.Path("homebrew/cartapel.rb")
          src = bump(f.read_text())
          for target in ("aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"):
              src = re.sub(rf'(cartapel-{re.escape(target)}\.tar\.gz"\n\s*sha256 ")[0-9a-f]{{64}}(")', rf'\g<1>{digest(target)}\g<2>', src)
          f.write_text(src)
          c = pathlib.Path("homebrew/cartapel-cask.rb")
          src = bump(c.read_text())
          for key, target in (("arm", "aarch64-apple-darwin"), ("intel", "x86_64-apple-darwin")):
              src = re.sub(rf'({key}:\s+")[0-9a-f]{{64}}(")', rf'\g<1>{digest(target)}\g<2>', src)
          c.write_text(src)
          for p in (f, c):
              if version not in p.read_text():
                  raise SystemExit(f"{p} was not stamped with {version}")
              print(f"--- {p} ---\n{p.read_text()}")
          PY
      - name: Push to the tap
        env:
          TAP_REPO: ${{ vars.TAP_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.TAP_SSH_KEY }}" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone --depth 1 "git@github.com:${TAP_REPO}.git" tap
          mkdir -p tap/Formula tap/Casks
          cp homebrew/cartapel.rb      tap/Formula/cartapel.rb
          cp homebrew/cartapel-cask.rb tap/Casks/cartapel.rb
          cd tap
          git config user.name "cartapel release"
          git config user.email "noreply@cartapel.com"
          git add Formula/cartapel.rb Casks/cartapel.rb
          git diff --cached --quiet && { echo "formula already at ${VERSION}"; exit 0; }
          git commit -m "cartapel ${VERSION}"
          git push
