# One command → a populated cartapel demo:
#   docker compose up
# then open http://localhost:8686 and log in with the credentials below.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme
    volumes:
      - ./demo/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme"]
      interval: 2s
      timeout: 3s
      retries: 20

  cartapel:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CARTAPEL_DB: postgres://acme:acme@db:5432/acme
      CARTAPEL_CONFIG: /demo/admin
      CARTAPEL_BASE_PATH: /admin
      CARTAPEL_SECRET_KEY: demo-secret-not-for-production
      CARTAPEL_SECURE_COOKIES: "false"
      # Public read-mostly demo user (view everything + safe curated actions).
      CARTAPEL_ADMIN_EMAIL: demo
      CARTAPEL_ADMIN_PASSWORD: demo
      CARTAPEL_ADMIN_ROLE: demo
      # The Platform pages ask this Grafana for their panels, server-side.
      CARTAPEL_GRAFANA_URL: http://metrics:3000
    ports:
      - "8686:8686"

  # Prometheus + Grafana in one container, the same image the public demo runs.
  # No port published: cartapel reaches it over the compose network and the
  # browser never opens Grafana, which is the whole point of the panels.
  metrics:
    build: ./demo/metrics
