# The MySQL-port test matrix: `docker compose -f docker-compose.test.yml up -d`
# then run the gated suites:
#   CARTAPEL_TEST_MYSQL=mysql://root:p0@localhost:33061/p0 cargo test mysql
#   (swap :33062 to exercise MariaDB)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: p0
      MYSQL_DATABASE: p0
    ports:
      - "33061:3306"
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: p0
      MARIADB_DATABASE: p0
    ports:
      - "33062:3306"
